# Static PV for Minikube (manual storageClass). EKS/GKE/AKS: drop this file,
# use the cluster StorageClass and a PVC-only manifest.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: demo-app-pv
  labels:
    app: demo-app
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/demo-app
    type: DirectoryOrCreate
